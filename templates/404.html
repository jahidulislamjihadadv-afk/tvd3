<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Not Found</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#0f172a,#050609);font-family:system-ui,sans-serif;color:#e2e8f0;text-align:center;padding:20px}
.num{font-size:clamp(80px,20vw,140px);font-weight:900;background:linear-gradient(135deg,#f43f5e,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:16px}
h1{font-size:clamp(18px,4vw,26px);font-weight:700;margin-bottom:10px}
p{color:#7d8590;font-size:15px;max-width:360px;line-height:1.6;margin:0 auto 28px}
.path{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:8px 16px;font-family:monospace;font-size:13px;color:#a5b4fc;display:inline-block;margin-bottom:28px;word-break:break-all}
</style>
</head>
<body>
<div>
  <div class="num">404</div>
  <h1>Page Not Found</h1>
  <p>The URL you requested does not exist or the channel is inactive.</p>
  <div class="path">{{ request.path }}</div>
</div>
</body>
</html>
