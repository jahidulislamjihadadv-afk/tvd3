<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#0f172a,#050609);font-family:system-ui,sans-serif;color:#e2e8f0}
.card{width:100%;max-width:380px;padding:36px 32px;background:#161b22;border:1px solid #30363d;border-radius:14px;box-shadow:0 24px 64px #0009}
.logo{text-align:center;margin-bottom:28px}
.logo .icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#f43f5e,#be123c);display:inline-grid;place-items:center;font-size:24px;box-shadow:0 8px 24px #e11d4840;margin-bottom:12px}
.logo h1{font-size:20px;font-weight:800;letter-spacing:-.4px}
.logo p{font-size:13px;color:#7d8590;margin-top:4px}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:700;color:#7d8590;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
input{width:100%;padding:10px 13px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e2e8f0;font:inherit;font-size:14px;transition:border-color .15s}
input:focus{outline:none;border-color:#e11d48}
.btn{width:100%;padding:11px;background:#e11d48;color:#fff;border:none;border-radius:8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .15s}
.btn:hover{background:#f43f5e}
.error{background:#2d1b1b;border:1px solid #6e2e2e;color:#f85149;border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.footer{text-align:center;font-size:12px;color:#4b5563;margin-top:22px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">📡</div>
    <h1>IPTV Admin</h1>
    <p>Sign in to manage your channels</p>
  </div>
  {% if error %}
  <div class="error">⚠ {{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required placeholder="Enter username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password">
    </div>
    <button class="btn" type="submit">Sign In →</button>
  </form>
  <div class="footer">IPTV Management Panel</div>
</div>
</body>
</html>
